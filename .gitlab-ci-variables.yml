# 📝 INSTRUCTIONS FOR SETTING UP VARIABLES
# =========================================
#
# 1. Go to your GitLab project
# 2. Navigate to Settings > CI/CD > Variables
# 3. Click "Add Variable" for each variable above
# 4. Set the key, value, and appropriate flags (Protected/Masked)
# 5. Save each variable
#
# 🔒 SECURITY BEST PRACTICES:
# - Mark sensitive variables as "Masked" to hide them in logs
# - Mark production variables as "Protected" to limit access
# - Use environment-specific variables for different stages
# - Regularly rotate passwords and API keys
# - Use least-privilege access for service accounts
#
# 📊 VARIABLE PRECEDENCE (highest to lowest):
# 1. Trigger variables (manual pipeline runs)
# 2. Scheduled pipeline variables
# 3. Project variables
# 4. Group variables
# 5. Instance variables
# 6. Variables defined in .gitlab-ci.yml
